name: Release

# Push a version tag to build & publish downloads:
#   git tag v0.6.0 && git push origin v0.6.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Builds the Tauri rewrite (droiddock-tauri/app) — the Electron app
  # (droiddock 2/) is retired from this job once Phase 16 parity validation
  # passes; until then it stays buildable locally, just not in CI.
  # Named "DroidDock Tauri" throughout: the macOS client has been both an
  # Electron and a Tauri app, and once a build is a bare .dmg in a release
  # there is nothing left to say which stack produced it.
  mac:
    name: Build DroidDock Tauri (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: droiddock-tauri/app/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: droiddock-tauri/app
        run: npm ci

      # Release notes come from CHANGELOG.md, not from this file — otherwise
      # every release needs a workflow edit, and the notes end up written by
      # whoever last touched CI rather than whoever wrote the code.
      #
      # Falls back to a generic body rather than failing the release: a tag with
      # no section is a documentation slip, not a reason to withhold the build.
      - name: Extract release notes for this tag
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          BODY=$(awk -v tag="## $TAG" '
            $0 == tag { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "::warning::No '## $TAG' section in CHANGELOG.md — using a generic body."
            BODY=$(printf 'DroidDock %s\n\n* **macOS** — DroidDock Tauri (`.dmg` / `.app`), built from `droiddock-tauri/`.\n* **Android** — `DroidDock-Android.apk`, built from `droiddock-android/`.' "$TAG")
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
      # Unsigned/ad-hoc, right-click-to-open — matches the Electron job's
      # `-c.mac.identity=null` precedent; notarization is a paid decision,
      # not made yet (see checkpoint.md's open questions).
      - name: Build & publish via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the `.app.tar.gz` the in-app updater downloads. This is
          # minisign, not Apple code signing — the app is still ad-hoc/unsigned
          # for Gatekeeper.
          #
          # REQUIRED, not optional. `createUpdaterArtifacts` is on in
          # tauri.conf.json and a pubkey is configured, so a missing private key
          # FAILS the build outright:
          #   "A public key has been found, but no private key."
          # (Verified locally by building with the variable unset — an earlier
          # comment here claimed the build merely went unsigned. It does not.)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: droiddock-tauri/app
          tagName: ${{ github.ref_name }}
          releaseName: 'DroidDock Tauri ${{ github.ref_name }}'
          # `latest.json` — the manifest the updater in `updater.rs` polls.
          #
          # It is fetched from `releases/latest/download/latest.json`, which
          # only resolves for a PUBLISHED release. With `releaseDraft: true`
          # below, that means the update endpoint goes live at the moment you
          # publish the draft by hand. That is the intended review gate, not a
          # bug — but it does mean a draft release is invisible to every
          # existing install until you press Publish.
          includeUpdaterJson: true
          releaseBody: ${{ steps.notes.outputs.body }}
          # Drafted, not published: the build lands as a draft to inspect and
          # release by hand. Flip to false once a run has been trusted end to end.
          releaseDraft: true
          prerelease: false

  android:
    name: Build DroidDock Android (APK)
    runs-on: ubuntu-latest
    # Serialized behind the mac job on purpose, at the cost of ~4 minutes.
    #
    # Both jobs write the SAME release for the tag, and neither owned it. The
    # first to arrive CREATES it and decides its fields; the second only adds
    # assets. Running in parallel made that a race, and it has now bitten twice:
    #
    #   v1.0.0 — mac created the draft, softprops (default `draft: false`)
    #            updated it and published it, overriding the review gate.
    #   v2.0.0 — softprops got there first and created the release with an EMPTY
    #            body; tauri-action then found it existing and only uploaded
    #            assets, because `releaseBody` applies at creation. The release
    #            shipped with no notes at all.
    #
    # `needs` makes ownership explicit rather than incidental: the mac job
    # always creates the release, with the notes and the draft flag, and this
    # job only ever attaches the APK to a release that already exists. It also
    # means a failed mac build skips the APK instead of leaving half a release.
    needs: mac
    defaults:
      run:
        working-directory: droiddock-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The release keystore, from a secret.
      #
      # This is what makes in-app updates possible at all: Android only lets an
      # APK replace one signed by the SAME certificate, and this job used to
      # publish `assembleDebug` signed with whatever throwaway debug keystore
      # the runner generated that morning — a different key every release.
      #
      # Failing loudly on a missing secret is deliberate. build.gradle.kts falls
      # back to debug signing when no keystore is present, which is right
      # locally and would be silently catastrophic here: it would ship another
      # APK nobody can upgrade from, and nothing would look wrong until users
      # tried to install it.
      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set. Publishing an unsigned or debug-signed APK would break in-app updates for every existing install."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/droiddock-release.jks"

      # Tests before the APK: a release that ships a broken address book is
      # worse than a release that doesn't happen, and these are JVM unit tests
      # that add seconds, not minutes.
      #
      # `versionTag` drives both versionName and versionCode (see
      # build.gradle.kts). The installer refuses an APK whose versionCode isn't
      # greater than the installed one, so deriving it from the tag is what
      # stops a forgotten manual bump from silently breaking updates.
      - name: Test and build the release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/droiddock-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PversionTag=${{ github.ref_name }}

      # Named to sit unambiguously beside the macOS "DroidDock Tauri" assets —
      # and matched exactly by UpdateChecker.kt's APK_ASSET, which finds the
      # download by this filename.
      - run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/DroidDock-Android.apk"
      - name: Publish APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: DroidDock-Android.apk
          # MUST match the mac job's `releaseDraft`. Both jobs write the same
          # release for this tag, and this action defaults to `draft: false` —
          # so on the v1.0.0 run it took the draft the mac job had just created
          # and published it, silently overriding the intent. Whichever job
          # finishes last decides, so the two settings have to agree.
          draft: true
