name: Release

# Push a version tag to build & publish downloads:
#   git tag v0.6.0 && git push origin v0.6.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Builds the Tauri rewrite (droiddock-tauri/app) — the Electron app
  # (droiddock 2/) is retired from this job once Phase 16 parity validation
  # passes; until then it stays buildable locally, just not in CI.
  mac:
    name: Build macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: droiddock-tauri/app/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: droiddock-tauri/app
        run: npm ci
      # Unsigned/ad-hoc, right-click-to-open — matches the Electron job's
      # `-c.mac.identity=null` precedent; notarization is a paid decision,
      # not made yet (see checkpoint.md's open questions).
      - name: Build & publish via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: droiddock-tauri/app
          tagName: ${{ github.ref_name }}
          releaseName: 'DroidDock ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version.'
          releaseDraft: false
          prerelease: false

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: droiddock-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK; the Gradle wrapper is in the repo.
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DroidDock.apk"
      - name: Publish APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: DroidDock.apk
