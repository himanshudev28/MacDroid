name: Release

# Push a version tag to build & publish downloads:
#   git tag v0.6.0 && git push origin v0.6.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Builds the Tauri rewrite (droiddock-tauri/app) — the Electron app
  # (droiddock 2/) is retired from this job once Phase 16 parity validation
  # passes; until then it stays buildable locally, just not in CI.
  # Named "DroidDock Tauri" throughout: the macOS client has been both an
  # Electron and a Tauri app, and once a build is a bare .dmg in a release
  # there is nothing left to say which stack produced it.
  mac:
    name: Build DroidDock Tauri (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: droiddock-tauri/app/src-tauri -> target
      - name: Install frontend dependencies
        working-directory: droiddock-tauri/app
        run: npm ci
      # Unsigned/ad-hoc, right-click-to-open — matches the Electron job's
      # `-c.mac.identity=null` precedent; notarization is a paid decision,
      # not made yet (see checkpoint.md's open questions).
      - name: Build & publish via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: droiddock-tauri/app
          tagName: ${{ github.ref_name }}
          releaseName: 'DroidDock Tauri ${{ github.ref_name }}'
          releaseBody: |
            DroidDock ${{ github.ref_name }}

            * **macOS** — DroidDock Tauri (`.dmg` / `.app`), built from `droiddock-tauri/`.
            * **Android** — `DroidDock-Android.apk`, built from `droiddock-android/`.
          # Drafted, not published: the build lands as a draft to inspect and
          # release by hand. Flip to false once a run has been trusted end to end.
          releaseDraft: true
          prerelease: false

  android:
    name: Build DroidDock Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: droiddock-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest ships the Android SDK; the Gradle wrapper is in the repo.
      - run: chmod +x gradlew && ./gradlew assembleDebug
      # Named to sit unambiguously beside the macOS "DroidDock Tauri" assets.
      - run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DroidDock-Android.apk"
      - name: Publish APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: DroidDock-Android.apk
          # MUST match the mac job's `releaseDraft`. Both jobs write the same
          # release for this tag, and this action defaults to `draft: false` —
          # so on the v1.0.0 run it took the draft the mac job had just created
          # and published it, silently overriding the intent. Whichever job
          # finishes last decides, so the two settings have to agree.
          draft: true
