name: Release

# Push a version tag to build & publish downloads:
#   git tag v0.6.0 && git push origin v0.6.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Builds the native Mac app (droiddock-native/: Rust core + SwiftUI). The
  # Tauri app (droiddock-tauri/) is the previous client and no longer ships from
  # CI; it stays in the repo and builds locally.
  #
  # The native app's update check reads GitHub's "latest release" and opens its
  # page, so all this job has to do is publish a release with the downloads.
  mac:
    name: Build DroidDock (macOS, native)
    # Swift tools 6.0 needs Xcode 16; Apple Silicon matches the arm64-only build.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: droiddock-native/core -> target

      # The app reports the version in core/Cargo.toml (Info.plist and the DMG
      # name are stamped from it), and its update check compares that against
      # the newest tag. Stamp the tag's version so the two can never disagree.
      - name: Stamp the version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -0pi -e 's/^version = "[^"]*"/version = "'"$VERSION"'"/m' droiddock-native/core/Cargo.toml
          grep -m1 '^version' droiddock-native/core/Cargo.toml

      # Release notes come from CHANGELOG.md, not from this file — otherwise
      # every release needs a workflow edit, and the notes end up written by
      # whoever last touched CI rather than whoever wrote the code.
      #
      # Falls back to a generic body rather than failing the release: a tag with
      # no section is a documentation slip, not a reason to withhold the build.
      - name: Extract release notes for this tag
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          BODY=$(awk -v tag="## $TAG" '
            $0 == tag { found = 1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "::warning::No '## $TAG' section in CHANGELOG.md — using a generic body."
            BODY=$(printf 'DroidDock %s\n\n* **macOS** — `DroidDock-%s.dmg` (native app), built from `droiddock-native/`.\n* **Android** — `DroidDock-Android.apk`, built from `droiddock-android/`.' "$TAG" "${TAG#v}")
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Ad-hoc signed (right-click → Open the first time). Developer ID signing
      # and notarization are a paid decision, not made yet; set CODESIGN_ID to
      # a Developer ID identity here once there is one.
      - name: Build the app
        run: droiddock-native/scripts/build.sh

      - name: Package the DMG and a zipped .app
        run: |
          droiddock-native/scripts/dmg.sh
          VERSION="${GITHUB_REF_NAME#v}"
          cp "droiddock-native/build/DroidDock-$VERSION.dmg" "$GITHUB_WORKSPACE/"
          ditto -c -k --keepParent droiddock-native/build/DroidDock.app "$GITHUB_WORKSPACE/DroidDock-$VERSION-mac.zip"

      # Crash symbols for this exact build (the shipped binary is stripped).
      - name: Keep the dSYM
        uses: actions/upload-artifact@v4
        with:
          name: DroidDock-dSYM-${{ github.ref_name }}
          path: droiddock-native/build/DroidDock.dSYM

      # Creates the release for this tag; the android job adds its APK to it.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: DroidDock ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            DroidDock-*.dmg
            DroidDock-*-mac.zip
          # MUST match the android job's `draft`: both jobs write this release.
          draft: false
          prerelease: false

  android:
    name: Build DroidDock Android (APK)
    runs-on: ubuntu-latest
    # Serialized behind the mac job on purpose, at the cost of ~4 minutes.
    #
    # Both jobs write the SAME release for the tag, and neither owned it. The
    # first to arrive CREATES it and decides its fields; the second only adds
    # assets. Running in parallel made that a race, and it has now bitten twice:
    #
    #   v1.0.0 — mac created the draft, softprops (default `draft: false`)
    #            updated it and published it, overriding the review gate.
    #   v2.0.0 — softprops got there first and created the release with an EMPTY
    #            body; the mac job (then tauri-action) found it existing and only
    #            uploaded assets, because the body applies at creation. The
    #            release shipped with no notes at all.
    #
    # `needs` makes ownership explicit rather than incidental: the mac job
    # always creates the release, with the notes and the draft flag, and this
    # job only ever attaches the APK to a release that already exists. It also
    # means a failed mac build skips the APK instead of leaving half a release.
    needs: mac
    defaults:
      run:
        working-directory: droiddock-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The release keystore, from a secret.
      #
      # This is what makes in-app updates possible at all: Android only lets an
      # APK replace one signed by the SAME certificate, and this job used to
      # publish `assembleDebug` signed with whatever throwaway debug keystore
      # the runner generated that morning — a different key every release.
      #
      # Failing loudly on a missing secret is deliberate. build.gradle.kts falls
      # back to debug signing when no keystore is present, which is right
      # locally and would be silently catastrophic here: it would ship another
      # APK nobody can upgrade from, and nothing would look wrong until users
      # tried to install it.
      - name: Decode the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set. Publishing an unsigned or debug-signed APK would break in-app updates for every existing install."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/droiddock-release.jks"

      # Tests before the APK: a release that ships a broken address book is
      # worse than a release that doesn't happen, and these are JVM unit tests
      # that add seconds, not minutes.
      #
      # `versionTag` drives both versionName and versionCode (see
      # build.gradle.kts). The installer refuses an APK whose versionCode isn't
      # greater than the installed one, so deriving it from the tag is what
      # stops a forgotten manual bump from silently breaking updates.
      - name: Test and build the release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/droiddock-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease -PversionTag=${{ github.ref_name }}

      # Named to sit unambiguously beside the macOS DMG and zip —
      # and matched exactly by UpdateChecker.kt's APK_ASSET, which finds the
      # download by this filename.
      - run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/DroidDock-Android.apk"
      # R8 mapping, for decoding crash traces (release is shrunk; names are kept
      # today via -dontobfuscate, but the mapping stays the source of truth if
      # that ever changes).
      - run: cp app/build/outputs/mapping/release/mapping.txt "$GITHUB_WORKSPACE/mapping-${{ github.ref_name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: android-mapping-${{ github.ref_name }}
          path: mapping-${{ github.ref_name }}.txt
      - name: Publish APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DroidDock-Android.apk
            mapping-${{ github.ref_name }}.txt
          # MUST match the mac job's `draft`. Both jobs write the same
          # release for this tag and whichever finishes last decides the flag —
          # on the v1.0.0 run this action's `draft: false` took the draft the
          # mac job had just created and published it, overriding the intent.
          # Both sides are false deliberately now, but they still have to agree:
          # flipping only one back to true would restore exactly that race, and
          # it would put the decision to ship in the APK job — the one that
          # doesn't own the release.
          draft: false
