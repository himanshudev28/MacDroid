[package]
name = "app"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = "0.29.0"
tokio = { version = "1.52.3", features = ["rt", "net", "time", "sync", "macros", "fs", "io-util", "process"] }
futures-util = "0.3.32"
if-addrs = "0.15.0"
gethostname = "1.1.0"
# Direct inline-reply notifications (Spike B verdict). Already a transitive MIT
# dep via tauri-plugin-notification; pinned here for the reply-capture path.
mac-notification-sys = "0.6"
# Phase 13: one-time platform-tools (adb) download-on-first-use, matching
# adb.js's `download()`. rustls (not the platform TLS backend / OpenSSL) keeps
# this dependency-light and licensing-clean (MIT/Apache-2.0 only).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Phase 17: FSEvents-backed file watcher for edit-in-place writeback.
notify = "8"
mdns-sd = { version = "0.20.3", default-features = false, features = ["async"] }
aes-gcm = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
getrandom = "0.4.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "NSColorSpace",
    "NSWorkspace",
    "NSAccessibility",
    "NSPasteboard",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
# Tier D: synthesising input events for the phone→Mac remote (mac_remote.rs).
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    # new_keyboard_event is gated behind this one.
    "CGRemoteOperation",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
] }

